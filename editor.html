<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#24141c">
<title>ルミナ ステージエディタ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="editor.css">
</head>
<body>
<header id="bar">
  <a class="b" href="index.html" title="ゲームへ戻る">◀</a>
  <strong class="title">ステージエディタ</strong>
  <span class="group">
    <button class="b tool on" data-tool="pen" title="ペン（1 マスずつ置く）">✏️</button>
    <button class="b tool" data-tool="rect" title="四角（ドラッグした範囲を埋める）">▭</button>
    <button class="b tool" data-tool="pick" title="スポイト（置いてある物を選ぶ）">💧</button>
    <button class="b tool" data-tool="hand" title="手（ドラッグでスクロール）">✋</button>
  </span>
  <span class="group">
    <button class="b" id="undo" title="元に戻す (Ctrl+Z)">↶</button>
    <button class="b" id="redo" title="やり直す (Ctrl+Y)">↷</button>
    <button class="b" id="grid" title="マス目の表示">#</button>
  </span>
  <label class="field">テーマ
    <select id="theme">
      <option value="grass">草原</option>
      <option value="cave">洞窟</option>
      <option value="ruins">遺跡</option>
      <option value="castle">お城</option>
    </select>
  </label>
  <label class="field">幅 <input id="width" type="number" min="16" max="1024" step="1"> マス</label>
  <span class="group">
    <button class="b" id="menu-btn" title="ファイル">☰</button>
    <button class="b play" id="play" title="テストプレイ">▶ テストプレイ</button>
  </span>
  <div id="menu" hidden>
    <button id="new">新しいステージ（地面だけ）</button>
    <button id="default">標準のテストステージを読み込む</button>
    <button id="export">ファイルに書き出す（.json）</button>
    <button id="import">ファイルから読み込む</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
  </div>
</header>

<main id="view">
  <canvas id="map" aria-label="ステージ"></canvas>
</main>
<div id="status"></div>
<input id="scroll" type="range" min="0" value="0" aria-label="横スクロール">

<nav id="palette" aria-label="パレット"></nav>

<script type="module" src="js/editor.js"></script>
</body>
</html>
